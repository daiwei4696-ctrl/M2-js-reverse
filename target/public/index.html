<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>r2coin 收银台 v2.4.1</title>
<style>
  body { font: 14px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;
         background:#0f1115; color:#d7dae0; margin:0; padding:32px; }
  .card { max-width:560px; margin:0 auto; background:#171a21; border:1px solid #262b36;
          border-radius:10px; padding:24px 28px; }
  h1 { font-size:18px; margin:0 0 4px; color:#fff; }
  .sub { color:#7b8494; font-size:12px; margin-bottom:18px; }
  label { display:block; font-size:12px; color:#8a93a3; margin-bottom:6px; }
  input { width:100%; box-sizing:border-box; padding:8px 10px; border-radius:6px;
          border:1px solid #2c313d; background:#0f1115; color:#e6e9ef; }
  button { margin-top:14px; width:100%; padding:10px; border:0; border-radius:6px;
           background:#2f6fED; color:#fff; font-weight:600; cursor:pointer; }
  button:hover { background:#447ff0; }
  #result { margin-top:16px; padding:10px 12px; border-radius:6px; background:#0b0d11;
            border:1px solid #232833; color:#9fb4ff; font-family:ui-monospace,Consolas,monospace;
            font-size:12px; white-space:pre-wrap; word-break:break-all; min-height:20px; }
</style>
</head>
<body>
<div class="card">
  <h1>r2coin 收银台</h1>
  <div class="sub">r2coin-sdk v2.4.1 &middot; endpoint <code>/api/pay</code></div>
  <label for="amount">金额（CNY）</label>
  <input id="amount" value="1">
  <button id="pay">立即支付</button>
  <div id="result">等待操作…</div>
</div>

<script>
  /* 页面初始化：给 localStorage 里的 sid 一个固定值（没有就种一个）。
     真实站点这里往往是登录态/会话 id —— 签名会依赖它。 */
  try {
    if (!localStorage.getItem("sid")) localStorage.setItem("sid", "lab-sid-2026");
  } catch (e) {}
</script>
<script src="/app.obf.js"></script>
</body>
</html>
